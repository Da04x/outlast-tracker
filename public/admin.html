<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZZY ADMIN</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="eyebrow">RESTRICTED // OWNER TERMINAL</div><h1>CHALLENGE CONTROL</h1><div class="panel counter"><label>ADMIN KEY</label><input id="key" class="admin-input" type="password" autocomplete="current-password" placeholder="Enter private admin key"><label>CURRENT CHALLENGE COUNT</label><input id="count" class="admin-input" type="number" min="0" max="400" value="183"><div class="admin-actions"><button data-delta="-1">−1</button><button data-delta="1">+1</button><button data-delta="5">+5</button><button data-delta="10">+10</button></div><button id="save" class="admin-save">SET EXACT COUNT</button><p id="msg" class="admin-status"></p><a href="/">← RETURN TO TRACKER</a></div></main><script>
const key=document.getElementById('key'),count=document.getElementById('count'),msg=document.getElementById('msg'),save=document.getElementById('save');
async function load(){try{const r=await fetch('/api/state?ts='+Date.now(),{cache:'no-store'});const d=await r.json();count.value=d.count}catch{}}
async function update(value){value=Math.max(0,Math.min(400,Math.floor(Number(value))));msg.textContent='UPDATING LIVE...';const r=await fetch('/api/admin/update',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key.value},body:JSON.stringify({count:value})});const d=await r.json();if(r.ok){count.value=d.count;msg.textContent='✓ LIVE COUNT UPDATED TO '+d.count}else msg.textContent='✕ '+(d.error||'Update failed')}
save.onclick=()=>update(count.value);
document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>update(Number(count.value)+Number(b.dataset.delta)));
load();
</script></body></html>
