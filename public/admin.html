<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AZZY ADMIN</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="eyebrow">RESTRICTED // OWNER TERMINAL</div><h1>CHALLENGE CONTROL</h1><div class="panel counter"><label>ADMIN KEY</label><input id="key" type="password" style="background:#010201;color:#a7ff91;border:1px solid #315b2c;padding:14px;font:inherit"><label>CHALLENGE COUNT</label><input id="count" type="number" min="0" max="400" value="183" style="background:#010201;color:#a7ff91;border:1px solid #315b2c;padding:14px;font:inherit"><button id="save" style="margin-top:20px;background:#071007;color:#a7ff91;border:1px solid #72ff58;padding:14px;font:inherit">UPDATE COUNT</button><p id="msg"></p><a href="/">← RETURN</a></div></main><script>save.onclick=async()=>{msg.textContent='UPDATING...';let r=await fetch('/api/admin/update',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key.value},body:JSON.stringify({count:Number(count.value)})});let d=await r.json();msg.textContent=r.ok?'✓ COUNT UPDATED':'✕ '+d.error}</script></body></html>
